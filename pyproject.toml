[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-json-guard"
version = "0.2.0"
description = "Schema-driven model output validation, extraction checks and bounded feedback loops."
authors = [{name = "Aarnav Saboo"}]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21,<5"]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
llm-json-guard = "llm_json_guard.cli:main"

[tool.setuptools.packages.find]
include = ["llm_json_guard*"]

[project.urls]
Repository = "https://github.com/aarnavsaboo/llm-json-guard"
